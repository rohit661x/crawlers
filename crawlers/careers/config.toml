# Career poller config.

concurrency = 4  # simultaneous HTTP companies

[http]
min_interval = 0.25      # seconds between requests to one host (unlisted hosts)
retries = 3              # extra attempts on 429 / 5xx / timeouts, exponential backoff (2s, 4s, 8s)
max_wait = 90            # don't honour a Retry-After longer than this; fail and try next run
company_timeout = 300    # whole-company fetch limit (override per company with `timeout`)

[http.host_intervals]    # slower pacing for hosts that rate-limit (suffix match)
"apply.careers.microsoft.com" = 3.0
"myworkdayjobs.com" = 0.75
"www.google.com" = 1.0
"jobs.apple.com" = 1.0
"www.amazon.jobs" = 0.5
"api.smartrecruiters.com" = 0.5

[alerts]                 # one Telegram alert per state change, not per run
shrink_ratio = 0.2       # listing < 20% of open jobs on record => fetcher likely broken, pause closures
shrink_min = 10          # ...only for companies with at least this many open jobs
shrink_accept_runs = 6   # still shrunk after this many runs => accept as real
burst_min = 25           # more "new" jobs than max(burst_min, burst_ratio * open) in one run
burst_ratio = 0.5        # => ids probably changed; absorb silently as re-baseline

[filters]
# Level: early-career only.
title_include = [
  "intern", "interns", "internship", "internships", "co-op", "coop", "student", "apprentice", "apprenticeship",
  "new grad", "new graduate", "new college grad", "university grad", "university graduate", "graduate",
  "early career", "early-career", "entry level", "entry-level", "junior", "associate",
  "fellow", "fellows", "fellowship", "residency", "resident", "campus",
  're:\b(engineer|developer|scientist|analyst)\s+I\b(?!I)',   # "Software Engineer I", not II
]
# Never senior, even if a level term matched (e.g. "Senior Associate", "Technical Fellow").
# "manager"/"lead" deliberately absent: "Associate Product Manager Intern" is entry level.
title_exclude = [
  "senior", "sr", "snr", "staff", "principal", "director", "head", "vp",
  "vice president", "distinguished", "technical fellow", "counsel", "recruiter", "recruiting", "officer",
  're:\b(II|III|IV|V)\b', "experienced",
]
# Function: tech roles. PLACEHOLDER, adjust to taste.
role_include = [
  "software", "engineer", "engineering", "developer", "swe", "sde", "data", "machine learning", "ml",
  "ai", "research", "researcher", "scientist", "security", "infrastructure", "product", "quant",
  "technical", "systems", "cloud", "network", "analytics", "deep learning", "computer vision", "robotics",
  "robot", "hardware", "silicon", "asic", "gpu", "soc", "rtl", "vlsi", "fpga", "embedded", "firmware",
  "verification", "validation", "physical design", "cad", "quantum", "ee", "design", "circuit",
  "architecture", "architect", "ic", "analog", "mixed signal", "test", "quantitative", "trader", "trading",
]
regions = ["US", "CA"]   # US + Canada (see geo.py); unplaceable locations ("Hybrid", "3 Locations") pass
locations = []           # extra substrings that also pass, e.g. ["London"]
remote_ok = true

[health]
hour = 9             # daily summary on the first run at/after 9:00 local
fail_threshold = 3   # consecutive failed runs before a company is flagged
expected_runs = 20   # hourly timer; fewer runs in 24h is flagged

# One [[companies]] block per company. `ats` picks the fetcher (see fetchers/__init__.py):
#   greenhouse | lever | ashby | smartrecruiters   slug = board name
#   workday      url = careers page; searches = ["text", ...]
#   amazon       searches = ["base_query", ...]
#   eightfold    host, domain; searches = [{param = value}, ...]
#   janestreet   (no options; janestreet.com JSON feed)
#   google | apple  searches = [{param = value}, ...]   (URL params of their search pages)
#   meta         searches = ["query string", ...]
#   custom       url, link_selector, optional title_selector / location_selector / wait_selector
# Optional: max_jobs (per search, default 2000), disabled = true,
#           [companies.filters] table overriding any global filter key.

[[companies]]
name = "Microsoft"
ats = "eightfold"
host = "apply.careers.microsoft.com"
domain = "microsoft.com"
# "internship" employment type covers the Intern seniority tag; MS rate-limits hard, so keep requests low
searches = [{filter_employment_type = "internship"}, {filter_seniority = "Entry"}]

[[companies]]
name = "Google"
ats = "google"
searches = [{target_level = "INTERN_AND_APPRENTICE"}, {target_level = "EARLY"}]

[[companies]]
name = "Amazon"
ats = "amazon"
searches = ["intern", "entry level"]

[[companies]]
name = "Apple"
ats = "apple"
searches = [{team = "internships-STDNT-INTRN"}]

[[companies]]
name = "Meta"
ats = "meta"
searches = ["roles[0]=Internship", "q=university%20grad"]

[[companies]]
name = "NVIDIA"
ats = "workday"
url = "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite"
searches = ["intern", "new college grad"]

